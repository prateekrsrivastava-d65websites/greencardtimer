name: Refresh Official Immigration Data

on:
  schedule:
    - cron: '17 13 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-bulletins
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh:bulletins
        id: bulletins
        continue-on-error: true
      - run: npm run refresh:processing
        id: processing
        continue-on-error: true
      - run: npm run refresh:employers -- --publish
        id: employers
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run prepare:career
      - run: npm test
      - run: npm run build
      - name: Refresh Summary
        env:
          BULLETINS_OUTCOME: ${{ steps.bulletins.outcome }}
          PROCESSING_OUTCOME: ${{ steps.processing.outcome }}
          EMPLOYERS_OUTCOME: ${{ steps.employers.outcome }}
          EMPLOYERS_STATUS: ${{ steps.employers.outputs.status }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const bulletins = JSON.parse(readFileSync('public/data/bulletins.json', 'utf8'));
          const processing = JSON.parse(readFileSync('public/data/processing.json', 'utf8'));
          const career = JSON.parse(readFileSync('data/career-release.json', 'utf8'));
          const latest = bulletins.bulletins.find(bulletin => bulletin.month === bulletins.latestMonth);
          const outcome = value => value === 'success' ? 'success; official source validated' : `${value || 'not run'}; last verified snapshot retained`;
          const lines = [
            '## Official Immigration Data Check', '',
            `Bulletin updater: ${outcome(process.env.BULLETINS_OUTCOME)}`,
            `PERM/PWD updater: ${outcome(process.env.PROCESSING_OUTCOME)}`, '',
            '### Published Bulletin Snapshot', '',
            `Latest edition: ${bulletins.latestMonth}`,
            `Snapshot verified: ${latest?.verifiedAt ?? bulletins.generatedAt}`,
            `Successful-check record: ${bulletins.refresh?.checkedAt ?? 'Not recorded'}`,
            `Retrieval: ${bulletins.refresh?.latestRetrievedFrom ?? latest?.sourceUrl ?? 'Not recorded'}`, '',
            'All four employment/family tables, all 100 tracked cells and monthly continuity passed validation; tests and build passed.', '',
            '### Published PERM/PWD Snapshot', '',
            `PERM source as of: ${processing.current.perm.asOf}`,
            `PWD source as of: ${processing.current.pwd.asOf}`,
            `Snapshot verified: ${processing.verifiedAt}`,
            `Successful-check record: ${processing.refresh?.checkedAt ?? 'Not recorded'}`,
            `Source: ${processing.sourceUrl}`, '',
            '### Published Employer / Salary Snapshot', '',
            `Employer updater: ${outcome(process.env.EMPLOYERS_OUTCOME)}`,
            `Result: ${process.env.EMPLOYERS_STATUS || 'Last verified snapshot retained'}`,
            `Release: FY${career.fiscalYear} Q${career.quarter}`,
            `Certified H-1B cases: ${career.records}; employers: ${career.employers}`,
            `Source: ${career.source.url}`,
            `Workbook SHA-256: ${career.source.sha256}`,
            `Verified static archive: ${career.archive.url}`, '',
            'Updater outcomes are separate from the retained snapshot dates. Failed sources preserve their last good data; independently valid updates can still publish before the job reports a source failure.',
            'Unchanged published files create no commit. Successful-check records are distinct from data verification dates.', '',
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE
      - name: Commit Only Changed, Validated Data
        run: |
          git add -- public/data/bulletins.json public/data/model.json public/data/processing.json data/career-release.json
          if test -f data/career-source-check.json; then
            git add -- data/career-source-check.json
          fi
          if git diff --cached --quiet; then
            echo "Official tables unchanged; no commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh official immigration data"
          git push origin HEAD:main
      - name: Report Any Source Failure
        if: steps.bulletins.outcome == 'failure' || steps.processing.outcome == 'failure' || steps.employers.outcome == 'failure'
        run: |
          echo "A source refresh failed. Last good data was preserved; independent valid updates were still published."
          exit 1
