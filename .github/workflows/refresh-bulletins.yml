name: Refresh Official Bulletins

on:
  schedule:
    - cron: '17 13 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-bulletins
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh:bulletins
      - run: npm run prepare:career
      - run: npm test
      - run: npm run build
      - name: Refresh Summary
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { appendFileSync } from "node:fs"; const data = JSON.parse(readFileSync("public/data/bulletins.json", "utf8")); appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Official bulletin check\n\nLatest edition: ${data.latestMonth}\n\nSuccessful check record: ${data.refresh.checkedAt}\n\nRetrieval: ${data.refresh.latestRetrievedFrom}\n\nBoth employment charts, all 50 tracked cells, monthly continuity, tests and build passed. Unchanged weekly checks do not create commits.\n`);'
      - name: Commit Only Changed, Validated Data
        run: |
          git add -- public/data/bulletins.json public/data/model.json
          if git diff --cached --quiet; then
            echo "Official tables unchanged; no commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh official visa bulletins"
          git push origin HEAD:main
